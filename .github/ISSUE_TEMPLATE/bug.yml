name: Reporte de error
description: Algo no funciona como se espera
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Qué pasó
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué se esperaba
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: SO, versión de .NET, navegador, rama o commit
